name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Generate the workerd Prisma client (output is gitignored).
      - run: npx prisma generate
      - run: npm run typecheck # web app (tsc)
      - run: npm run agent:typecheck # agent worker (tsc)
      - run: npm run lint
      # CHE-100: the one-attempt rule for a rejected credential. Verified here
      # rather than by asking the owner to break a password by hand — that is
      # homework, and this product exists to remove it.
      - run: npm run verify:gates
      # The doer's rails — same reason: unattended decisions get tested.
      - run: npm run verify:doer
      # Smoke-build the web worker via OpenNext (catches bundle/runtime issues).
      - run: npx opennextjs-cloudflare build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Gate: deploy only once Cloudflare creds exist (and R2/Workers Paid are
      # enabled on the account). Until then the pipeline is green and skips
      # deploy — it activates automatically when the secret is added.
      - name: Check deploy credentials
        id: creds
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ready != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy (CHE-19 awaits R2 + Workers Paid)."

      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ready == 'true'
        run: npm ci
      - if: steps.creds.outputs.ready == 'true'
        run: npx prisma generate
      # Apply D1 migrations to the remote database before deploying.
      - if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply checkmyapp --remote
      # Deploy the agent worker first (it defines the CheckRunWorkflow the web
      # worker binds to cross-worker).
      - if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler-agent.jsonc
      # Build + deploy the web worker (OpenNext). The build must run with the
      # same .env as a local deploy: Next.js bakes NEXT_PUBLIC_* AND server env
      # (Clerk keys etc.) into the workerd bundle at build time — without them
      # every SSR page 500s with "Missing publishableKey" (incident 2026-08-16).
      # WEB_BUILD_DOTENV is the owner's .env stored as a single GitHub secret.
      - if: steps.creds.outputs.ready == 'true'
        run: printf '%s\n' "$WEB_BUILD_DOTENV" > .env
        env:
          WEB_BUILD_DOTENV: ${{ secrets.WEB_BUILD_DOTENV }}
      - if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare build
      - if: steps.creds.outputs.ready == 'true'
        run: npx opennextjs-cloudflare deploy
