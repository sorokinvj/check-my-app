# Cross-review: whoever writes the code does not judge it (CHE-116).
#
# The doer hands implementation to Codex. Codex also reviews pull requests —
# which would make it author and sole approver of its own work, the exact thing
# rule §8 forbids toward customers and the reason this project exists. So the
# reviewer here is deliberately a different vendor from the implementer.
#
# The mirror of this arrangement runs on karass-landing, where Claude writes and
# Codex reviews. Neither product has a model grading itself.
#
# This still only proves the code is sound. Whether the customer's problem is
# actually gone is decided by a later CheckMyApp run walking the deployed site
# from outside (src/agent/reconcile.ts) — never by a review, and never by a merge.

name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # The dispatcher opens every doer PR carrying one file — .doer/TICKET.md —
    # and only then asks the implementer. Reviewing that is reviewing a ticket,
    # and worse: a clean review of an empty diff is what the merge gate reads as
    # "nobody objects". A PR that touches nothing else never reaches a reviewer;
    # the state machine refuses it on the same rule (scripts/doer/machine.mjs).
    paths-ignore:
      - ".doer/**"

# One review per head. A second push supersedes the first, and a verdict about
# an older push is not a verdict — the doer's merge gate enforces the same rule.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A review that can only read cannot leave a finding. The inline comments
    # ARE the output here — the shepherd counts unresolved review threads and
    # would read a silent, permission-denied run as a clean one, which is how a
    # gate merges a change nobody judged (CHE-122, the merge gate).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # A subscription token, not an API key: reviews then draw on the
          # owner's plan instead of billing per call. Generated with
          # `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # --allowedTools is an exhaustive allowlist, not an addition. Naming
          # only the inline-comment tool denied `Skill`, which is how the
          # code-review plugin is invoked — so on 2026-09-03 two runs reported
          # "permission_denied: Execute skill: code-review:code-review", spawned
          # a background agent to check the PR's state, announced they would
          # wait for it, and exited. The job went green having reviewed nothing.
          # Read as a clean review by anything downstream, which is precisely
          # the absence the merge gate must never mistake for a verdict.
          claude_args: '--allowedTools "Skill,Task,Read,Grep,Glob,Bash,mcp__github_inline_comment__create_inline_comment"'
          # The action refuses a bot actor by default, so that bots cannot
          # trigger each other in a loop. On a doer PR the pushes come from
          # Codex, which is precisely the case this review exists for — so that
          # one bot is named, and no others.
          allowed_bots: "chatgpt-codex-connector[bot]"
          # A review that finds nothing leaves no inline comment and no formal
          # review, so from outside it is indistinguishable from a review that
          # never ran — and the merge gate reads silence as "nobody objects".
          # The first real review (head 7715aa0, 2026-09-03) came back in 23
          # seconds over 6 turns with one permission denial and published
          # nothing at all, and there was no way to tell which of those it was.
          # The report in the step summary is that missing trace. It is
          # Claude-authored text, which the action warns about; this repository
          # reviews only its own code, and the alternative is a gate judging on
          # an absence.
          display_report: true
